# pnpm 11 (used by EAS Build): approve install scripts per package.
allowBuilds:
  "@sentry/cli": true
# pnpm 10 equivalent.
onlyBuiltDependencies:
  - "@sentry/cli"

# React Native / Expo tooling (Babel, Metro, Gradle autolinking) resolves many
# packages from the project root, which pnpm's default isolated node_modules
# hides. Use a flat, npm-style node_modules instead.
nodeLinker: hoisted
